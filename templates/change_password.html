{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card narrow">
<form method="post" class="stack">
  {{ csrf() }}
  <div class="field"><label>Current password</label><input type="password" name="current" required></div>
  <div class="field"><label>New password (min 8 characters)</label><input type="password" name="new" minlength="8" required></div>
  <div class="field"><label>Confirm new password</label><input type="password" name="confirm" minlength="8" required></div>
  <button class="btn">Update password</button>
</form></div>
{% endblock %}
